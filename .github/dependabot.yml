version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
    ignore:
      - dependency-name: "Nice3point.Revit.Api*"
      - dependency-name: "Microsoft.Extensions.DependencyInjection"
        versions: [">= 9.0.0"]
      - dependency-name: "System.Text.Json"
        versions: [">= 9.0.0"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        versions: [">= 18.0.0"]
      - dependency-name: "coverlet.collector"
        versions: [">= 7.0.0"]
      - dependency-name: "PolySharp"
        versions: [">= 1.16.0"]
      - dependency-name: "Microsoft.Data.Sqlite"
        versions: [">= 9.0.0"]
      - dependency-name: "SQLitePCLRaw.bundle_e_sqlite3"
        versions: [">= 3.0.0"]
      # v9+ targets .NET 9/10 — incompatible with net8.0 (Revit 2025) and net48 (Revit 2024).
      # Static constructor in LocalFamilyImportService.TypeCatalog.cs throws TypeInitializationException.
      # See #114. Keep on 8.x until SmartCon drops net8.0/net48 support.
      - dependency-name: "System.Text.Encoding.CodePages"
        versions: [">= 9.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    labels:
      - ci
