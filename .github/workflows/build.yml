name: Build All Versions

on:
  push:
    branches: [main]
    tags: ['v*', 'v*-alpha*', 'v*-beta*', 'v*-rc*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.editorconfig'
              - '*.sln'

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release.R19, Release.R21, Release.R24, Release.R25, Release.R26, Release.R27]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          # global.json пинит SDK 10.0.1xx (Revit 2027 = net10); SDK 10 собирает
          # все TFM (net48/net8/net10), 8.0.x оставлен как страховка runtime
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-

      - name: Build ${{ matrix.configuration }}
        run: dotnet build src/SmartCon.App/SmartCon.App.csproj -c ${{ matrix.configuration }}

  build-success:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        run: |
          if [[ "${{ needs.changes.outputs.src }}" == "true" ]]; then
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "Build passed"
              exit 0
            else
              echo "Build failed: ${{ needs.build.result }}"
              exit 1
            fi
          else
            echo "No source changes — skipping build"
            exit 0
          fi

  test:
    needs: [changes, build]
    if: needs.changes.outputs.src == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          # SDK 10 — из global.json; runtime 8.0 — для запуска net8-тестов
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-

      - name: Run Tests
        run: dotnet test src/SmartCon.Tests/SmartCon.Tests.csproj -c Release.R25

      # Compile-only: интеграционные тесты выполняются внутри реального Revit
      # (Nice3point.TUnit.Revit), на GitHub-hosted runner его нет — только
      # проверяем компиляцию, прогон локальный (см. smartcon-testing skill).
      # R25 (net8) + R27 (net10) + R21 (net48): polyfill/STJ-риски на net48,
      # TUnit-overload-риски (CS0121, #5765) — на net10.
      - name: Build Integration Tests R25 (compile-only, no Revit on runner)
        run: dotnet build src/SmartCon.IntegrationTests/SmartCon.IntegrationTests.csproj -c Release.R25

      - name: Build Integration Tests R27 (compile-only, no Revit on runner)
        run: dotnet build src/SmartCon.IntegrationTests/SmartCon.IntegrationTests.csproj -c Release.R27

      - name: Build Integration Tests R21 (compile-only, no Revit on runner)
        run: dotnet build src/SmartCon.IntegrationTests/SmartCon.IntegrationTests.csproj -c Release.R21

  test-success:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test result
        run: |
          if [[ "${{ needs.changes.outputs.src }}" == "true" ]]; then
            if [[ "${{ needs.test.result }}" == "success" ]]; then
              echo "Tests passed"
              exit 0
            else
              echo "Tests failed: ${{ needs.test.result }}"
              exit 1
            fi
          else
            echo "No source changes — skipping tests"
            exit 0
          fi
